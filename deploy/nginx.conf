# Ubuntu/Debian template: install into sites-available, included from nginx's http{}.
# Requires an existing TLS certificate. Adjust paths/domain before enabling.
limit_req_zone $binary_remote_addr zone=tanoti_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tanoti_api:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=tanoti_connections:10m;
# Omit query strings (searches contain customer identifiers).
log_format tanoti_privacy '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name returns.tanotiofficial.com;
    if ($host != returns.tanotiofficial.com) { return 444; }
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://returns.tanotiofficial.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name returns.tanotiofficial.com;
    if ($host != returns.tanotiofficial.com) { return 444; }
    ssl_certificate /etc/letsencrypt/live/returns.tanotiofficial.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/returns.tanotiofficial.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/tanoti/frontend/dist;
    index index.html;
    client_max_body_size 22m;
    client_body_timeout 20s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn tanoti_connections 20;
    limit_req_status 429;
    access_log /var/log/nginx/tanoti-access.log tanoti_privacy;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # These settings are inherited by each proxy location; never append untrusted XFF.
    proxy_set_header Host returns.tanotiofficial.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
    proxy_cache off;

    location ~ ^/api/(admin/)?auth/ {
        client_max_body_size 4k;
        limit_req zone=tanoti_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    # Signed Shopify callbacks have a separate allowance from interactive traffic.
    location /api/webhooks/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/ {
        limit_req zone=tanoti_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /uploads/ {
        limit_req zone=tanoti_api burst=30 nodelay;
        # MUST go through Flask authorization. No alias/root for the upload directory.
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:env|sql|sqlite|db|bak|tar|gz|zip|map)$ { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
